<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Criador de Molduras</title>
    <style>
        :root {
            --primary: #006805;     
            --secondary: #71BF50;   
            --accent: #FECD29;      
            --bg-color: #F2F2F7;    
            --card-bg: #FFFFFF;     
            --text-main: #1C1C1E;   
            --text-sub: #8E8E93;    
            --border-color: rgba(60, 60, 67, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            margin-top: 24px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 24px 24px 16px;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-sub);
            font-weight: 400;
        }

        .canvas-wrapper {
            position: relative;
            width: calc(100% - 48px);
            aspect-ratio: 1/1;
            margin: 0 auto 24px;
            border-radius: 24px;
            background: #E5E5EA;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px var(--border-color);
            touch-action: none;
        }

        #previewCanvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #ffffff;
            image-rendering: high-quality;
        }

        .floating-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 600;
            color: var(--primary);
            font-size: 15px;
            pointer-events: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            display: none;
            z-index: 20;
        }

        .placeholder-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-sub);
            font-weight: 500;
            font-size: 16px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .placeholder-text svg {
            color: var(--text-sub);
            opacity: 0.5;
        }

        .hint-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-sub);
            margin-top: -12px;
            margin-bottom: 16px;
            display: none;
        }

        .hint-text.active {
            display: block;
        }

        .frame-selector {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 0 24px 24px;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }

        .frame-selector::-webkit-scrollbar {
            display: none;
        }

        .frame-option {
            flex: 0 0 72px;
            height: 72px;
            border-radius: 18px;
            background: var(--bg-color);
            border: 3px solid transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            scroll-snap-align: start;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            box-shadow: inset 0 0 0 1px var(--border-color);
        }

        .frame-option-inner {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-sub);
        }

        .frame-option.active {
            border-color: var(--primary);
            background: #E8F5E9;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(0, 104, 5, 0.15);
        }

        .frame-option.active .frame-option-inner {
            color: var(--primary);
        }

        .controls-area {
            padding: 0 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-upload {
            background: var(--secondary);
            color: #FFFFFF;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(113, 191, 80, 0.2);
        }

        .btn-upload input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .btn-camera {
            background: var(--accent);
            color: var(--text-main);
            box-shadow: 0 2px 10px rgba(254, 205, 41, 0.2);
        }

        .btn-primary {
            background: var(--primary);
            color: #FFFFFF;
            width: 100%;
            font-size: 17px;
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 4px 16px rgba(0, 104, 5, 0.25);
        }

        .btn-primary:disabled {
            background: #A1C2A3;
            box-shadow: none;
            pointer-events: none;
        }

        .btn-reset {
            background: #F2F2F7;
            color: #FF3B30;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>Molduras HQ</h1>
            <div class="subtitle">Alta resolução • 1080x1080</div>
        </div>

        <div class="canvas-wrapper" id="previewContainer">
            <canvas id="previewCanvas" width="1080" height="1080"></canvas>
            <div class="floating-badge" id="loadingIndicator">Carregando...</div>
            <div class="placeholder-text" id="placeholderMsg">
                <svg width="48" height="48" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                Toque na galeria
            </div>
        </div>

        <p class="hint-text" id="adjustHint">👆 Arraste e faça pinça para ajustar a foto</p>

        <!-- Menu dinâmico: as molduras serão criadas aqui pelo JavaScript -->
        <div class="frame-selector" id="frameSelector"></div>

        <div class="controls-area">
            <div class="action-row">
                <div class="btn btn-upload">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Galeria
                    <input type="file" id="fileInput" accept="image/*">
                </div>
                <button class="btn btn-camera" id="cameraBtn">
                    <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    Câmera
                </button>
            </div>
            
            <button class="btn btn-primary" id="downloadBtn" disabled>
                <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                Salvar ou Compartilhar
            </button>

            <button class="btn btn-reset" id="resetBtn" style="display: none;">
                Remover Foto
            </button>
        </div>
    </div>

    <script>
        const CANVAS_SIZE = 1080;
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('fileInput');
        const cameraBtn = document.getElementById('cameraBtn');
        const resetBtn = document.getElementById('resetBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const placeholderMsg = document.getElementById('placeholderMsg');
        const adjustHint = document.getElementById('adjustHint');
        const previewContainer = document.getElementById('previewContainer');
        const frameSelector = document.getElementById('frameSelector');

        let originalImage = null;
        let imageLoaded = false;
        let isCameraMode = false;
        let cameraStream = null;

        let zoomLevel = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;
        let lastPanX = 0;
        let lastPanY = 0;
        let initialDistance = 0;
        let initialZoom = 1;
        let initialPanX = 0;
        let initialPanY = 0;

        // =============================================================
        // CONFIGURAÇÃO DOS ARQUIVOS LOCAIS (Hospedado na Vercel)
        // =============================================================
        // Para adicionar novas molduras, basta inserir no FINAL desta lista.
        // O sistema cuidará de ordená-las da mais nova para a mais antiga.
        const FRAMES_URLS = [
            "mold 01.png",
            "mold 02.png",
            "mold 03.png",
            "mold 04.png",
            "mold 05.png",
            "mold 06.png",
            "mold 07.png" // VÍRGULA ADICIONADA AQUI (CORREÇÃO)
        ];
        // =============================================================

        // Inicia com a moldura mais recente (a última da lista)
        let currentFrameIndex = FRAMES_URLS.length - 1; 
        let activeFrameImage = new Image();
        let isFrameLoaded = false;

        // FUNÇÃO PARA GERAR OS BOTÕES DINAMICAMENTE (Mais recentes primeiro)
        function initializeFrames() {
            frameSelector.innerHTML = ''; // Limpa o container
            
            // Percorre a lista de trás para frente
            for (let i = FRAMES_URLS.length - 1; i >= 0; i--) {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'frame-option';
                
                // Define a primeira a ser gerada como ativa
                if (i === currentFrameIndex) {
                    optionDiv.classList.add('active');
                }
                
                optionDiv.setAttribute('data-index', i);
                
                const innerDiv = document.createElement('div');
                innerDiv.className = 'frame-option-inner';
                innerDiv.textContent = i + 1; // Exibe o número da moldura baseado na ordem
                
                optionDiv.appendChild(innerDiv);
                
                // Adiciona o evento de clique
                optionDiv.addEventListener('click', function() {
                    document.querySelectorAll('.frame-option').forEach(opt => opt.classList.remove('active'));
                    this.classList.add('active');
                    currentFrameIndex = parseInt(this.getAttribute('data-index'));
                    loadSelectedFrame();
                });
                
                frameSelector.appendChild(optionDiv);
            }
        }

        function drawPlaceholder() {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            
            if (isFrameLoaded && activeFrameImage.complete) {
                ctx.drawImage(activeFrameImage, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
            }
            
            placeholderMsg.style.display = imageLoaded ? 'none' : 'flex';
            downloadBtn.disabled = true;
            adjustHint.classList.remove('active');
            resetBtn.style.display = 'none';
        }

        function loadSelectedFrame() {
            loadingIndicator.style.display = 'block';
            activeFrameImage.onload = () => {
                isFrameLoaded = true;
                loadingIndicator.style.display = 'none';
                
                const overlayElement = document.getElementById('cameraOverlay');
                if (overlayElement) {
                    overlayElement.src = activeFrameImage.src;
                }

                if (imageLoaded) {
                    renderCanvas();
                } else {
                    drawPlaceholder();
                }
            };
            activeFrameImage.onerror = () => {
                loadingIndicator.style.display = 'none';
                alert("Erro ao carregar a moldura. Verifique se as imagens estão na mesma pasta do código na Vercel.");
            };
            activeFrameImage.src = FRAMES_URLS[currentFrameIndex];
        }

        function renderCanvas() {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            
            if (imageLoaded && originalImage) {
                placeholderMsg.style.display = 'none';
                resetBtn.style.display = 'flex';
                
                const imgAspect = originalImage.width / originalImage.height;
                let drawWidth, drawHeight;

                if (imgAspect > 1) {
                    drawHeight = CANVAS_SIZE;
                    drawWidth = CANVAS_SIZE * imgAspect;
                } else {
                    drawWidth = CANVAS_SIZE;
                    drawHeight = CANVAS_SIZE / imgAspect;
                }

                const finalWidth = drawWidth * zoomLevel;
                const finalHeight = drawHeight * zoomLevel;

                const x = (CANVAS_SIZE - finalWidth) / 2 + panX;
                const y = (CANVAS_SIZE - finalHeight) / 2 + panY;
                
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                ctx.clip(); 
                ctx.drawImage(originalImage, x, y, finalWidth, finalHeight);
                ctx.restore();
            }
            
            if (isFrameLoaded && activeFrameImage.complete) {
                ctx.drawImage(activeFrameImage, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
            }
            
            downloadBtn.disabled = !imageLoaded;
        }

        function handleImageUpload(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('Por favor, selecione uma imagem válida.');
                return;
            }

            loadingIndicator.style.display = 'block';
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    imageLoaded = true;
                    loadingIndicator.style.display = 'none';
                    adjustHint.classList.add('active');
                    
                    zoomLevel = 1;
                    panX = 0;
                    panY = 0;
                    
                    renderCanvas();
                };
                img.onerror = () => {
                    loadingIndicator.style.display = 'none';
                    alert('Erro ao carregar a imagem.');
                };
                img.src = e.target.result;
            };
            reader.onerror = () => {
                loadingIndicator.style.display = 'none';
                alert('Erro ao ler o arquivo.');
            };
            reader.readAsDataURL(file);
        }

        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            
            const videoElement = document.getElementById('cameraVideo');
            const overlayElement = document.getElementById('cameraOverlay');
            const btnElement = document.getElementById('captureBtn');
            
            if (videoElement) videoElement.remove();
            if (overlayElement) overlayElement.remove();
            if (btnElement) btnElement.remove();
            
            isCameraMode = false;
        }

        function openCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('Seu navegador não suporta câmera ou não tem permissão.');
                return;
            }

            stopCamera();

            const video = document.createElement('video');
            video.id = 'cameraVideo';
            video.style.position = 'absolute';
            video.style.top = '0'; 
            video.style.left = '0';
            video.style.width = '100%'; 
            video.style.height = '100%';
            video.style.objectFit = 'cover';
            video.style.zIndex = '5';
            video.setAttribute('playsinline', '');
            video.setAttribute('autoplay', '');
            
            const overlayImg = document.createElement('img');
            overlayImg.id = 'cameraOverlay';
            overlayImg.style.position = 'absolute';
            overlayImg.style.top = '0';
            overlayImg.style.left = '0';
            overlayImg.style.width = '100%';
            overlayImg.style.height = '100%';
            overlayImg.style.objectFit = 'contain';
            overlayImg.style.zIndex = '6';
            overlayImg.style.pointerEvents = 'none';
            
            if (isFrameLoaded && activeFrameImage.complete) {
                overlayImg.src = activeFrameImage.src;
            }

            previewContainer.appendChild(video);
            previewContainer.appendChild(overlayImg);

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1080 } }, 
                audio: false 
            })
            .then((stream) => {
                cameraStream = stream;
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    isCameraMode = true;
                    
                    const captureBtn = document.createElement('button');
                    captureBtn.id = 'captureBtn';
                    captureBtn.innerHTML = '📸 Capturar';
                    captureBtn.className = 'btn btn-primary';
                    captureBtn.style.position = 'absolute';
                    captureBtn.style.bottom = '16px';
                    captureBtn.style.left = '50%';
                    captureBtn.style.transform = 'translateX(-50%)';
                    captureBtn.style.width = 'calc(100% - 32px)';
                    captureBtn.style.zIndex = '10';
                    previewContainer.appendChild(captureBtn);
                    
                    captureBtn.addEventListener('click', () => {
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = CANVAS_SIZE;
                        tempCanvas.height = CANVAS_SIZE;
                        const tCtx = tempCanvas.getContext('2d');
                        
                        const size = Math.min(video.videoWidth, video.videoHeight);
                        const sx = (video.videoWidth - size) / 2;
                        const sy = (video.videoHeight - size) / 2;
                        tCtx.drawImage(video, sx, sy, size, size, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
                        
                        const img = new Image();
                        img.onload = () => {
                            originalImage = img;
                            imageLoaded = true;
                            adjustHint.classList.add('active');
                            zoomLevel = 1; panX = 0; panY = 0;
                            stopCamera();
                            renderCanvas();
                        };
                        img.src = tempCanvas.toDataURL('image/png');
                    });
                };
            })
            .catch((err) => {
                alert('Erro ao acessar a câmera. Verifique as permissões do seu navegador.');
                stopCamera();
            });
        }

        function getTouchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        previewContainer.addEventListener('touchstart', (e) => {
            if (!imageLoaded || isCameraMode) return;
            e.preventDefault();
            const touches = e.touches;
            
            if (touches.length === 1) {
                isDragging = true;
                startX = touches[0].clientX;
                startY = touches[0].clientY;
                lastPanX = panX;
                lastPanY = panY;
            } else if (touches.length === 2) {
                isDragging = false;
                initialDistance = getTouchDistance(touches);
                initialZoom = zoomLevel;
                const rect = previewContainer.getBoundingClientRect();
                const scaleX = CANVAS_SIZE / rect.width;
                const scaleY = CANVAS_SIZE / rect.height;
                const center = {
                    x: (touches[0].clientX + touches[1].clientX) / 2,
                    y: (touches[0].clientY + touches[1].clientY) / 2
                };
                window._zoomCenterX = (center.x - rect.left) * scaleX - (CANVAS_SIZE/2);
                window._zoomCenterY = (center.y - rect.top) * scaleY - (CANVAS_SIZE/2);
                initialPanX = panX;
                initialPanY = panY;
            }
        }, { passive: false });

        previewContainer.addEventListener('touchmove', (e) => {
            if (!imageLoaded || isCameraMode) return;
            e.preventDefault();
            const touches = e.touches;
            
            if (touches.length === 1 && isDragging) {
                const dx = touches[0].clientX - startX;
                const dy = touches[0].clientY - startY;
                const rect = previewContainer.getBoundingClientRect();
                const scaleX = CANVAS_SIZE / rect.width;
                const scaleY = CANVAS_SIZE / rect.height;
                panX = lastPanX + dx * scaleX;
                panY = lastPanY + dy * scaleY;
                renderCanvas();
            } else if (touches.length === 2) {
                const distance = getTouchDistance(touches);
                const scale = distance / initialDistance;
                let newZoom = Math.min(Math.max(initialZoom * scale, 0.5), 4);
                
                const zoomDelta = newZoom - initialZoom;
                const centerX = window._zoomCenterX || 0;
                const centerY = window._zoomCenterY || 0;
                panX = initialPanX - zoomDelta * centerX;
                panY = initialPanY - zoomDelta * centerY;
                
                zoomLevel = newZoom;
                renderCanvas();
            }
        }, { passive: false });

        previewContainer.addEventListener('touchend', () => {
            isDragging = false;
            const maxPanX = CANVAS_SIZE * Math.max(1, zoomLevel);
            const maxPanY = CANVAS_SIZE * Math.max(1, zoomLevel);
            panX = Math.min(Math.max(panX, -maxPanX), maxPanX);
            panY = Math.min(Math.max(panY, -maxPanY), maxPanY);
            renderCanvas();
        });

        let isMouseDragging = false;
        let mouseStartX, mouseStartY;

        previewContainer.addEventListener('mousedown', (e) => {
            if (!imageLoaded || isCameraMode) return;
            isMouseDragging = true;
            mouseStartX = e.clientX;
            mouseStartY = e.clientY;
            lastPanX = panX;
            lastPanY = panY;
            previewContainer.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isMouseDragging || !imageLoaded || isCameraMode) return;
            const dx = e.clientX - mouseStartX;
            const dy = e.clientY - mouseStartY;
            const rect = previewContainer.getBoundingClientRect();
            const scaleX = CANVAS_SIZE / rect.width;
            const scaleY = CANVAS_SIZE / rect.height;
            panX = lastPanX + dx * scaleX;
            panY = lastPanY + dy * scaleY;
            renderCanvas();
        });

        window.addEventListener('mouseup', () => {
            if (isMouseDragging) {
                isMouseDragging = false;
                previewContainer.style.cursor = 'default';
                renderCanvas();
            }
        });

        previewContainer.addEventListener('wheel', (e) => {
            if (!imageLoaded || isCameraMode) return;
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            const newZoom = Math.min(Math.max(zoomLevel + delta, 0.5), 4);
            
            const rect = previewContainer.getBoundingClientRect();
            const scaleX = CANVAS_SIZE / rect.width;
            const scaleY = CANVAS_SIZE / rect.height;
            const centerX = (e.clientX - rect.left) * scaleX - (CANVAS_SIZE/2);
            const centerY = (e.clientY - rect.top) * scaleY - (CANVAS_SIZE/2);
            
            const zoomDelta = newZoom - zoomLevel;
            panX = panX - zoomDelta * centerX;
            panY = panY - zoomDelta * centerY;
            
            zoomLevel = newZoom;
            renderCanvas();
        }, { passive: false });

        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                if (isCameraMode) stopCamera();
                handleImageUpload(this.files[0]);
            }
        });

        cameraBtn.addEventListener('click', openCamera);

        resetBtn.addEventListener('click', () => {
            if (isCameraMode) stopCamera();
            originalImage = null;
            imageLoaded = false;
            fileInput.value = '';
            zoomLevel = 1; panX = 0; panY = 0;
            drawPlaceholder();
        });

        // =============================================================
        // LÓGICA UNIVERSAL DE COMPARTILHAMENTO / DOWNLOAD (SAMSUNG FIX)
        // =============================================================
        downloadBtn.addEventListener('click', async () => {
            if (!imageLoaded) return;
            
            const originalText = downloadBtn.innerHTML;
            downloadBtn.innerHTML = "⏳ Processando...";
            downloadBtn.disabled = true;

            try {
                const dataUrl = canvas.toDataURL('image/png', 1.0);
                let arr = dataUrl.split(','), mime = arr[0].match(/:(.*?);/)[1];
                let bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
                while(n--){
                    u8arr[n] = bstr.charCodeAt(n);
                }
                const fileName = `moldura_${new Date().getTime()}.png`;
                const file = new File([u8arr], fileName, { type: mime });

                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

                if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'Minha Foto'
                        });
                        showSuccess();
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            fallbackDownload(file, fileName);
                        } else {
                            resetButton();
                        }
                    }
                } else {
                    fallbackDownload(file, fileName);
                }
            } catch (error) {
                console.error(error);
                alert('Erro ao processar a imagem. Tente acessar por outro navegador.');
                resetButton();
            }

            function fallbackDownload(fileObj, name) {
                try {
                    const url = window.URL.createObjectURL(fileObj);
                    const link = document.createElement('a');
                    link.style.display = 'none';
                    link.href = url;
                    link.download = name;
                    
                    document.body.appendChild(link);
                    link.click();
                    
                    setTimeout(() => {
                        document.body.removeChild(link);
                        window.URL.revokeObjectURL(url);
                        showSuccess();
                    }, 200);
                } catch (e) {
                    alert("O download foi bloqueado. Tente abrir no Chrome ou Safari.");
                    resetButton();
                }
            }

            function showSuccess() {
                downloadBtn.innerHTML = "✅ Concluído!";
                downloadBtn.style.background = "var(--secondary)";
                setTimeout(resetButton, 2000);
            }

            function resetButton() {
                downloadBtn.innerHTML = originalText;
                downloadBtn.style.background = "var(--primary)";
                downloadBtn.disabled = false;
            }
        });

        // =============================================================
        // INICIALIZAÇÃO AUTOMÁTICA
        // =============================================================
        window.onload = () => {
            initializeFrames(); // Cria as opções de moldura dinamicamente
            loadSelectedFrame();
            openCamera();
        };
    </script>
</body>
</html>
